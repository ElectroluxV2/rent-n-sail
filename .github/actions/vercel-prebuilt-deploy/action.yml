name: Deploy Vercel prebuilt project
description: Build and upload a Vercel deployment using configuration from the calling job environment.
runs:
  using: composite
  steps:
    - name: Prepare Vercel CLI cache
      id: vercel_cli
      shell: bash
      # language=bash
      run: |
        node_version=$(node --version)
        pnpm_version=$(pnpm --version)
        {
          echo "node-version=$node_version"
          echo "pnpm-version=$pnpm_version"
        } >> "$GITHUB_OUTPUT"
        echo "$RUNNER_TOOL_CACHE/vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Restore Vercel CLI cache
      id: vercel_cli_cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ runner.tool_cache }}/vercel-cli
        key: vercel-cli-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.vercel_cli.outputs.node-version }}-pnpm-${{ steps.vercel_cli.outputs.pnpm-version }}-vercel-${{ env.VERCEL_CLI_VERSION }}

    - name: Install Vercel CLI with pnpm
      if: steps.vercel_cli_cache.outputs.cache-hit != 'true'
      shell: bash
      # language=bash
      run: |
        mkdir -p "$RUNNER_TOOL_CACHE/vercel-cli"
        # Keep package links inside the cached installation.
        pnpm --dir "$RUNNER_TOOL_CACHE/vercel-cli" add --save-exact \
          --allow-build=esbuild \
          --store-dir "$RUNNER_TEMP/vercel-cli-store" \
          --config.virtual-store-type=project \
          "vercel@$VERCEL_CLI_VERSION"
        vercel --version

    - name: Save Vercel CLI cache
      if: steps.vercel_cli_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ runner.tool_cache }}/vercel-cli
        key: ${{ steps.vercel_cli_cache.outputs.cache-primary-key }}

    - name: Build and deploy prebuilt output
      shell: bash
      working-directory: ${{ github.workspace }}
      # language=bash
      run: |
        config_args=()
        if [[ -n "$VERCEL_LOCAL_CONFIG" ]]; then
          config_args+=(--local-config "$VERCEL_LOCAL_CONFIG")
        fi

        if [[ "$VERCEL_ENVIRONMENT" == "preview" ]]; then
          if [[ -z "$VERCEL_GIT_BRANCH" ]]; then
            printf '%s\n' "A git branch is required for a Vercel preview deployment." >&2
            exit 1
          fi

          vercel pull --yes --environment=preview --git-branch="$VERCEL_GIT_BRANCH" --token="$VERCEL_TOKEN"
          vercel build "${config_args[@]}" --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt "${config_args[@]}" --token="$VERCEL_TOKEN"
        else
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build "${config_args[@]}" --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt "${config_args[@]}" --prod --token="$VERCEL_TOKEN"
        fi
