name: Ensure Vercel deployment
description: Reuse a ready branch deployment or publish portable prebuilt output with target-specific runtime configuration.
outputs:
  url:
    description: Stable URL for this application's target environment.
    value: ${{ steps.publish.outputs.url }}
runs:
  using: composite
  steps:
    - name: Resolve deployment and runtime bindings
      id: resolve
      shell: bash
      # language=bash
      run: |
        export STATE_FILE="$RUNNER_TEMP/rns-deployment.json"
        export ARCHIVE_PATH="$RUNNER_TEMP/rns-artifact/build-output.tar.gz"
        {
          echo "STATE_FILE=$STATE_FILE"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH"
        } >> "$GITHUB_ENV"
        bash ci/deploy.sh plan
    - name: Set up cached Vercel CLI
      if: steps.resolve.outputs.mode != 'reuse'
      uses: $/.github/actions/setup-vercel-cli
      env:
        # Security: dependency installation must not receive deployment credentials.
        VERCEL_TOKEN: ""
        NEON_API_KEY: ""
        GITHUB_TOKEN: ""
    - name: Pull target project settings
      if: steps.resolve.outputs.mode != 'reuse'
      shell: bash
      # language=bash
      run: |
        pull_args=(--yes --environment "$DEPLOY_TARGET")
        if [[ "$DEPLOY_TARGET" == "preview" ]]; then
          pull_args+=(--git-branch "$DEPLOY_BRANCH")
        fi
        vercel pull --local-config "$VERCEL_LOCAL_CONFIG" "${pull_args[@]}"
    - name: Build selected application locally
      if: steps.resolve.outputs.mode == 'build'
      shell: bash
      # language=bash
      run: |
        bash ci/deploy.sh build-env
        env -u NEON_API_KEY -u GITHUB_TOKEN vercel build --local-config "$VERCEL_LOCAL_CONFIG" --environment "$DEPLOY_TARGET"
    - name: Package portable output without runtime credentials
      if: steps.resolve.outputs.mode == 'build'
      shell: bash
      # language=bash
      run: bash ci/deploy.sh pack
    - name: Retain compiled output for zero-build previews
      id: artifact
      if: steps.resolve.outputs.mode == 'build'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: rns-${{ env.COMPONENT }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/rns-artifact/build-output.tar.gz
        compression-level: 0
        retention-days: 90
        if-no-files-found: error
    - name: Download verified retained output
      if: steps.resolve.outputs.mode == 'restore'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN: ${{ steps.resolve.outputs.artifact_run_id }}
        SOURCE_ARTIFACT: ${{ steps.resolve.outputs.artifact_name }}
      # language=bash
      run: gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir "$RUNNER_TEMP/rns-artifact"
    - name: Restore portable output
      if: steps.resolve.outputs.mode == 'restore'
      shell: bash
      # language=bash
      run: bash ci/deploy.sh restore
    - name: Apply runtime configuration and publish
      id: publish
      shell: bash
      env:
        BUILD_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        BUILD_ARTIFACT_NAME: rns-${{ env.COMPONENT }}-${{ github.run_id }}-${{ github.run_attempt }}
      # language=bash
      run: bash ci/deploy.sh publish
    - name: Verify live application and dependency wiring
      if: steps.resolve.outputs.mode != 'reuse'
      shell: bash
      # language=bash
      run: bash ci/deploy.sh smoke
    - name: Failed deployment summary
      if: failure()
      shell: bash
      # language=bash
      run: echo "## Deployment failed — see the workflow annotations and sanitized logs." >> "$GITHUB_STEP_SUMMARY"
