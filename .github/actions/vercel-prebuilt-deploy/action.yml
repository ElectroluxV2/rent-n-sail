name: Ensure Vercel deployment
description: Leave unchanged deployments alone; publish changed applications with private runtime bindings.
outputs:
  url:
    description: Stable URL for this application's target environment.
    value: ${{ steps.publish.outputs.url || steps.existing.outputs.url }}
runs:
  using: composite
  steps:
    - name: 🔗 Resolve existing deployment
      id: existing
      if: env.BUILD_REQUESTED != 'true'
      uses: actions/github-script@v9.0.0
      env:
        DEPLOY_OPERATION: reuse
        CI_SCRIPT: ${{ github.action_path }}/deploy.cjs
      with:
        # language=javascript
        script: |
          await require(process.env.CI_SCRIPT)({ core, exec });
    - name: ⚙️ Set up Vercel CLI
      if: env.BUILD_REQUESTED == 'true'
      uses: $/.github/actions/setup-vercel-cli
      env:
        # Security: dependency installation must not receive deployment credentials.
        VERCEL_TOKEN: ""
        NEON_API_KEY: ""
        GITHUB_TOKEN: ""
    - name: 📥 Pull project settings
      if: env.BUILD_REQUESTED == 'true'
      uses: actions/github-script@v9.0.0
      env:
        DEPLOY_OPERATION: pull
        CI_SCRIPT: ${{ github.action_path }}/deploy.cjs
      with:
        # language=javascript
        script: |
          await require(process.env.CI_SCRIPT)({ core, exec });
    - name: 🔨 Build application
      if: env.BUILD_REQUESTED == 'true'
      uses: actions/github-script@v9.0.0
      env:
        DEPLOY_OPERATION: build
        CI_SCRIPT: ${{ github.action_path }}/deploy.cjs
      with:
        # language=javascript
        script: |
          await require(process.env.CI_SCRIPT)({ core, exec });
    - name: 🚀 Publish deployment
      id: publish
      if: env.BUILD_REQUESTED == 'true'
      uses: actions/github-script@v9.0.0
      env:
        DEPLOY_OPERATION: publish
        CI_SCRIPT: ${{ github.action_path }}/deploy.cjs
      with:
        # language=javascript
        script: |
          await require(process.env.CI_SCRIPT)({ core, exec });
    - name: ❌ Report deployment failure
      if: failure()
      uses: actions/github-script@v9.0.0
      with:
        # language=javascript
        script: |
          await core.summary.addHeading('Deployment failed').addRaw('See workflow annotations and sanitized logs.', true).write();
