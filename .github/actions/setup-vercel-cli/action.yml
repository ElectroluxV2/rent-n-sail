name: Set up Vercel CLI
description: Restore or install the lockfile-pinned Vercel CLI on the runner's Node.js, independently of any checkout.
runs:
  using: composite
  steps:
    # Hosted runners ship Node.js and npm, so this action installs neither: the CLI runs on the `node`
    # already on PATH. Only the frontend build installs Node.js, because it must restore the exact
    # version locked by frontend/package.json.
    - name: 🧭 Locate Vercel CLI
      id: cli
      shell: bash
      # hashFiles() cannot read this action's snapshot, whose path also changes with every commit, so the
      # cache uses a fixed directory and a key hashed here.
      # language=bash
      run: |
        echo "$RUNNER_TEMP/vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"
        hash=$(cat "$GITHUB_ACTION_PATH/action.yml" "$GITHUB_ACTION_PATH/package-lock.json" | sha256sum | cut -d' ' -f1)
        echo "cache-key=vercel-cli-$RUNNER_OS-$RUNNER_ARCH-$hash" >> "$GITHUB_OUTPUT"
    - name: 📥 Restore Vercel CLI
      id: cache
      uses: actions/cache@v6.1.0
      with:
        path: ${{ runner.temp }}/vercel-cli
        key: ${{ steps.cli.outputs.cache-key }}
    - name: 📦 Install Vercel CLI
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      # Linux runs the JavaScript CLI; our commands load none of its optional platform binaries or install scripts.
      # language=bash
      run: |
        mkdir -p "$RUNNER_TEMP/vercel-cli"
        cp "$GITHUB_ACTION_PATH/package.json" "$GITHUB_ACTION_PATH/package-lock.json" "$RUNNER_TEMP/vercel-cli/"
        npm ci --prefix "$RUNNER_TEMP/vercel-cli" --omit=optional --ignore-scripts --no-audit --no-fund
