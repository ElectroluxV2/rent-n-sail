name: Set up Vercel CLI
description: Install the lockfile-pinned Vercel CLI and Node.js runtime from this action, independently of any checkout.
runs:
  using: composite
  steps:
    - name: ⚙️ Set up Vercel CLI
      uses: pnpm/setup@v3.1.1
      with:
        working-directory: ${{ github.action_path }}
        dest: ${{ runner.temp }}/vercel-cli-pnpm
        require-lockfile: true
    - name: ⚙️ Add Vercel CLI to PATH
      shell: bash
      # language=bash
      run: echo "$GITHUB_ACTION_PATH/node_modules/.bin" >> "$GITHUB_PATH"
