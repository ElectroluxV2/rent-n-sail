name: Check changed path
description: Check whether the event's before/after diff contains a path substring.
inputs:
  path:
    description: Path substring to check, for example backend/.
    required: true
outputs:
  changed:
    description: Whether a changed path contains the supplied substring.
    value: ${{ steps.detect.outputs.changed }}
runs:
  using: composite
  steps:
    - name: 🔍 Check changed path
      id: detect
      shell: bash
      env:
        CHECK_PATH: ${{ inputs.path }}
        # push and pull_request synchronize events carry before/after. Opened/reopened pull requests
        # have neither, so they compare the PR base with the merge commit (github.sha); manual runs
        # compare the current commit with itself, which reports no changes.
        BEFORE: ${{ github.event.before || github.event.pull_request.base.sha || github.sha }}
        AFTER: ${{ github.event.after || github.sha }}
        GH_TOKEN: ${{ github.token }}
      # language=bash
      run: |
        repo="$RUNNER_TEMP/changes.git"
        GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0
        printf '::add-mask::%s\n' "${GIT_CONFIG_VALUE_0#*basic }"
        git init --bare --quiet "$repo"
        git -C "$repo" fetch --quiet --depth=1 --filter=blob:none "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$BEFORE" "$AFTER"
        paths=$(git -C "$repo" diff --name-only --no-renames -z "$BEFORE" "$AFTER" | jq -Rs 'split("\u0000")[:-1]')
        printf 'Searched path: %s\nChanged paths:\n' "$(jq -Rn --arg path "$CHECK_PATH" '$path')"
        jq -C . <<< "$paths"
        jq -r --arg path "$CHECK_PATH" '"changed=\(any(.[]; contains($path)))"' <<< "$paths" | tee -a "$GITHUB_OUTPUT"
