name: GitHub script with provider clients
description: Run github-script with the lockfile-pinned Neon and Vercel SDKs installed by pnpm.
inputs:
  script:
    description: JavaScript body executed by actions/github-script.
    required: true
outputs:
  url:
    description: Public application URL.
    value: ${{ steps.script.outputs.url }}
  deployment_id:
    description: Non-secret Vercel deployment ID.
    value: ${{ steps.script.outputs.deployment_id }}
  branch_id:
    description: Non-secret Neon preview branch ID.
    value: ${{ steps.script.outputs.branch_id }}
  parent_branch_id:
    description: Non-secret Neon production parent ID.
    value: ${{ steps.script.outputs.parent_branch_id }}
runs:
  using: composite
  steps:
    - name: ⚙️ Set up provider clients
      uses: pnpm/setup@v3.1.1
      env:
        # Package installation never receives provider/database credentials.
        VERCEL_TOKEN: ""
        NEON_API_KEY: ""
        GH_TOKEN: ""
        GITHUB_TOKEN: ""
        DATABASE_URL: ""
      with:
        working-directory: ${{ github.action_path }}
        # pnpm/setup turns an action-local lockfile into a rejected `../` glob; an absolute path is accepted.
        cache-dependency-path: ${{ github.action_path }}/pnpm-lock.yaml
        dest: ${{ runner.temp }}/provider-script-pnpm
        require-lockfile: true
    - name: 🔗 Run provider script
      id: script
      uses: actions/github-script@v9.0.0
      with:
        script: ${{ inputs.script }}
