name: Neon operation
description: Run a Neon provider operation from the action snapshot without checking out source.
inputs:
  operation:
    description: database-branch, database-plan, or database-env.
    required: true
outputs:
  branch_id:
    description: Non-secret preview branch ID.
    value: ${{ steps.operation.outputs.branch_id }}
  parent_branch_id:
    description: Non-secret production parent ID.
    value: ${{ steps.operation.outputs.parent_branch_id }}
runs:
  using: composite
  steps:
    - name: 🔗 Resolve Neon resource
      id: operation
      uses: actions/github-script@v9.0.0
      env:
        NEON_OPERATION: ${{ inputs.operation }}
        PROVIDERS_MODULE: ${{ github.action_path }}/../_shared/providers.cjs
      with:
        # language=javascript
        script: |
          const { createProviders } = require(process.env.PROVIDERS_MODULE);
          const providers = createProviders({ core });
          const operations = {
            'database-plan': async () => {
              core.setOutput('parent_branch_id', await providers.getProductionDatabase());
            },
            'database-branch': async () => {
              core.setOutput('branch_id', await providers.getDatabasePreviewFor({ create: true }));
            },
            'database-env': async () => {
              // Credentials stay in this job, never in action or script-result outputs.
              core.exportVariable('DATABASE_URL', await providers.getDatabaseConnectionFor({
                branchId: process.env.NEON_BRANCH_ID,
                pooled: false,
              }));
            },
          };
          await operations[process.env.NEON_OPERATION]();
