name: Reusable database CI/CD
on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: ""
      target:
        type: string
        default: ""
      build:
        type: boolean
        default: false
    secrets:
      NEON_API_KEY:
        required: false
      NEON_PROJECT_ID:
        required: false
    outputs:
      branch_id:
        description: Non-secret Neon branch reference; credentials never cross job outputs.
        value: ${{ jobs.database.outputs.branch_id }}
permissions:
  contents: read
  pull-requests: write
jobs:
  database:
    name: Deployment
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    concurrency:
      group: database-${{ (inputs.target || (github.event_name == 'push' && 'production' || 'preview')) == 'production' && 'production' || (inputs.branch || github.head_ref || github.ref_name) }}
      cancel-in-progress: false
      queue: max
    environment:
      name: database-${{ (inputs.target || (github.event_name == 'push' && 'production' || 'preview')) == 'production' && 'production' || (inputs.branch || github.head_ref || github.ref_name) }}
    outputs:
      branch_id: ${{ steps.reference.outputs.branch_id }}
    env:
      DEPLOY_BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
      DEPLOY_TARGET: ${{ inputs.target || (github.event_name == 'push' && 'production' || 'preview') }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
      NEON_PARENT_BRANCH_ID: ${{ vars.NEON_PARENT_BRANCH_ID }}
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME || 'neondb' }}
      NEON_ROLE_NAME: ${{ vars.NEON_ROLE_NAME || 'neondb_owner' }}
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔍 Check database changes
        id: changes
        if: github.event_name == 'push' || github.event.action == 'synchronize'
        uses: $/.github/actions/component-changes
        with:
          path: database/
      - name: 🧪 Test CI scripts
        # language=bash
        run: bash ci/test.sh
      - name: 🧭 Select migration path
        id: selection
        env:
          BUILD: ${{ inputs.build || steps.changes.outputs.changed == 'true' || github.event.action == 'opened' || github.event.action == 'reopened' }}
        # language=bash
        run: echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: 🌱 Ensure preview branch
        id: branch
        if: env.DEPLOY_TARGET == 'preview'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        # language=bash
        run: bash ci/deploy.sh database-branch
      - name: 🔗 Resolve production parent
        id: plan
        if: env.DEPLOY_TARGET == 'production' || steps.selection.outputs.build == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        # language=bash
        run: bash ci/deploy.sh database-plan
      - name: 🧭 Select database reference
        id: reference
        env:
          NEON_BRANCH_ID: ${{ env.DEPLOY_TARGET == 'preview' && steps.branch.outputs.branch_id || steps.plan.outputs.parent_branch_id }}
        # language=bash
        run: echo "branch_id=$NEON_BRANCH_ID" >> "$GITHUB_OUTPUT"
      - name: ⚙️ Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        if: steps.selection.outputs.build == 'true'
        with:
          working-directory: database
          enable-cache: true
          cache-python: true
          activate-environment: true
      - name: 📦 Install migration tools
        if: steps.selection.outputs.build == 'true'
        # language=bash
        run: uv sync --directory database --locked
      - name: 🧪 Test migrations
        if: steps.selection.outputs.build == 'true'
        env:
          PYTEST_RUN_PATH: database
        # language=bash
        run: uv run --directory database --locked pytest -q
      - name: 🔐 Resolve migration credentials
        if: steps.selection.outputs.build == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BRANCH_ID: ${{ steps.reference.outputs.branch_id }}
        # language=bash
        run: bash ci/deploy.sh database-env
      - name: 🚀 Apply migrations
        if: steps.selection.outputs.build == 'true'
        # language=bash
        run: uv run --directory database --locked alembic upgrade head
      - name: 📝 Comment schema changes
        if: steps.selection.outputs.build == 'true' && github.event_name == 'pull_request' && env.DEPLOY_TARGET == 'preview'
        uses: neondatabase/schema-diff-action@v1.0.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          base_branch: ${{ steps.plan.outputs.parent_branch_id }}
          compare_branch: ${{ steps.reference.outputs.branch_id }}
          database: ${{ env.NEON_DATABASE_NAME }}
      - name: 📝 Write deployment summary
        env:
          NEON_BRANCH_ID: ${{ steps.reference.outputs.branch_id }}
        # language=bash
        run: |
          {
            echo "## Database deployment"
            echo "Neon branch: $NEON_BRANCH_ID"
            echo "Migration path selected: ${{ steps.selection.outputs.build }}"
          } >> "$GITHUB_STEP_SUMMARY"
