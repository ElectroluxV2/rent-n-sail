name: Reusable database CI/CD
on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: ""
      target:
        type: string
        default: ""
      build:
        type: boolean
        default: false
    secrets:
      NEON_API_KEY:
        required: false
      NEON_PROJECT_ID:
        required: false
    outputs:
      branch_id:
        description: Non-secret Neon branch reference; credentials never cross job outputs.
        value: ${{ jobs.database.outputs.branch_id }}
permissions:
  contents: read
  pull-requests: write
jobs:
  database:
    name: Deployment
    runs-on: ubuntu-26.04
    environment:
      name: database-${{ case(inputs.target == 'production' || (inputs.target == '' && github.event_name == 'push'), 'production', inputs.branch || github.head_ref || github.ref_name) }}
    outputs:
      branch_id: ${{ steps.reference.outputs.branch_id }}
    env:
      DEPLOY_BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
      DEPLOY_TARGET: ${{ case(inputs.target != '', inputs.target, github.event_name == 'push', 'production', 'preview') }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
      NEON_PARENT_BRANCH_ID: ${{ vars.NEON_PARENT_BRANCH_ID }}
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME || 'neondb' }}
      NEON_ROLE_NAME: ${{ vars.NEON_ROLE_NAME || 'neondb_owner' }}
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: 🔍 Check database changes
        id: changes
        uses: $/.github/actions/component-changes
        with:
          path: database/
      - name: 🧭 Select migration path
        uses: actions/github-script@v9.0.0
        env:
          BUILD: ${{ inputs.build || steps.changes.outputs.changed == 'true' || github.event.action == 'opened' || github.event.action == 'reopened' }}
        with:
          # language=javascript
          script: |
            const build = process.env.BUILD === 'true';
            core.info(build ? 'Migration path: install migration tools and apply pending migrations.' : 'No database changes: skip migration tools and leave the schema untouched.');
            core.exportVariable('BUILD_REQUESTED', String(build));
      - name: 🌱 Ensure preview branch
        id: branch
        if: env.DEPLOY_TARGET == 'preview'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        uses: $/.github/actions/neon-operation
        with:
          operation: database-branch
      - name: 🔗 Resolve production parent
        id: plan
        if: env.DEPLOY_TARGET == 'production' || env.BUILD_REQUESTED == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        uses: $/.github/actions/neon-operation
        with:
          operation: database-plan
      - name: 🧭 Select database reference
        id: reference
        uses: actions/github-script@v9.0.0
        env:
          NEON_BRANCH_ID: ${{ env.DEPLOY_TARGET == 'preview' && steps.branch.outputs.branch_id || steps.plan.outputs.parent_branch_id }}
        with:
          # language=javascript
          script: |
            core.info(`Selected ${process.env.DEPLOY_TARGET} database branch: ${process.env.NEON_BRANCH_ID}`);
            core.setOutput('branch_id', process.env.NEON_BRANCH_ID);
      - name: 📥 Checkout migration source
        if: env.BUILD_REQUESTED == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        if: env.BUILD_REQUESTED == 'true'
        with:
          working-directory: database
          enable-cache: true
          cache-python: true
          activate-environment: true
      - name: 📦 Install migration tools
        if: env.BUILD_REQUESTED == 'true'
        # language=bash
        run: uv sync --directory database --locked
      - name: 🔐 Resolve migration credentials
        if: env.BUILD_REQUESTED == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BRANCH_ID: ${{ steps.reference.outputs.branch_id }}
        uses: $/.github/actions/neon-operation
        with:
          operation: database-env
      - name: 🚀 Apply migrations
        if: env.BUILD_REQUESTED == 'true'
        # language=bash
        run: uv run --directory database --locked alembic upgrade head
      - name: 📝 Comment schema changes
        if: env.BUILD_REQUESTED == 'true' && github.event_name == 'pull_request' && env.DEPLOY_TARGET == 'preview'
        uses: neondatabase/schema-diff-action@v1.0.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          base_branch: ${{ steps.plan.outputs.parent_branch_id }}
          compare_branch: ${{ steps.reference.outputs.branch_id }}
          database: ${{ env.NEON_DATABASE_NAME }}
      - name: 📝 Write deployment summary
        uses: actions/github-script@v9.0.0
        env:
          NEON_BRANCH_ID: ${{ steps.reference.outputs.branch_id }}
        with:
          # language=javascript
          script: |
            const migrations = process.env.BUILD_REQUESTED === 'true' ? 'Alembic upgrade head completed (pending revisions only).' : 'skipped (no database changes).';
            await core.summary.addHeading('Database deployment').addRaw(`Neon branch: ${process.env.NEON_BRANCH_ID}\nMigrations: ${migrations}`, true).write();
