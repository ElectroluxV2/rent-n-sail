name: 🚀 Stack CI/CD
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: stack-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
  queue: max
jobs:
  database:
    name: 🗄️ Database
    uses: $/.github/workflows/reusable-database.yml
    with:
      target: &target ${{ case(github.event_name == 'push', 'production', 'preview') }}
    secrets: inherit
  backend:
    name: ⚙️ Backend
    needs: database
    uses: $/.github/workflows/reusable-backend.yml
    with:
      target: *target
    secrets: inherit
  frontend:
    name: 🌐 Frontend
    needs: backend
    uses: $/.github/workflows/reusable-frontend.yml
    with:
      target: *target
    secrets: inherit
