name: Frontend CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Pnpm
        uses: pnpm/setup@v3
        with:
          working-directory: frontend
          cache: true

      - name: Angular
        run: pnpm exec ng build
