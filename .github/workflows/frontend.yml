name: Manual frontend CI/CD
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [preview, production]
        default: preview
      build:
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: stack-${{ inputs.target == 'production' && 'production' || github.ref_name }}
  cancel-in-progress: false
  queue: max
jobs:
  frontend:
    uses: ./.github/workflows/reusable-frontend.yml
    with:
      branch: ${{ github.ref_name }}
      target: ${{ inputs.target }}
      build: ${{ inputs.build }}
    secrets: inherit
