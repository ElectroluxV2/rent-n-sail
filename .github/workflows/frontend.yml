name: 🌐 Manual frontend CI/CD
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [preview, production]
        default: preview
      update:
        type: boolean
        default: true
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: stack-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
  queue: max
jobs:
  frontend:
    name: 🌐 Frontend
    uses: $/.github/workflows/reusable-frontend.yml
    with:
      target: ${{ inputs.target }}
      update: ${{ inputs.update }}
    secrets: inherit
