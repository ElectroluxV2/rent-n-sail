name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      PNPM_CONFIG_COLOR: always
      FORCE_COLOR: "1"
    
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Pnpm
        uses: pnpm/setup@v3.1.1
        with:
          working-directory: frontend
          cache: true

      - name: Lint (Angular ESLint)
        # language=bash
        run: pnpm exec eslint . --format gha
        continue-on-error: true
      
      - name: Check formatting
        uses: oxc-project/oxfmt-action@v0.0.1
        continue-on-error: true
        with:
          working-directory: frontend

      - name: Run Unit Tests (Vitest)
        continue-on-error: true
        # language=bash
        run: pnpm exec ng test --no-watch --no-progress --reporters=github-actions   

      - name: Angular
        # language=bash
        run: pnpm exec ng build

      - name: Fail if lint, formatting or tests failed
        if: contains(steps.*.outcome, 'failure')
        # language=bash
        run: |
          echo "::error::Frontend validation failed."
          exit 1
