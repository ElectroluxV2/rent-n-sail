name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      PNPM_CONFIG_COLOR: always
      FORCE_COLOR: "1"
    
    defaults:
      run:
        working-directory: backend
        
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
          enable-cache: true

      - name: Install dependencies
        # language=bash
        run: uv sync --locked
        
      - name: Lint (Ruff)
        id: ruff_lint
        uses: astral-sh/ruff-action@v4.1.0
        continue-on-error: true
        with:
          src: backend
          version-file: backend/uv.lock
          # language=bash
          args: check --output-format=github

      - name: Format (Ruff)
        id: ruff_format
        uses: astral-sh/ruff-action@v4.1.0
        continue-on-error: true
        with:
          src: backend
          version-file: backend/uv.lock
          # language=bash
          args: format --check --output-format=github

      - name: Fail if lint or formatting failed
        if: >-
          ${{
              steps.ruff_lint.outcome == 'failure' ||
              steps.ruff_format.outcome == 'failure'
          }}  
        # language=bash
        run: exit 1
