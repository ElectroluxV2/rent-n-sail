name: ⚙️ Manual backend CI/CD
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [preview, production]
        default: preview
      build:
        type: boolean
        default: true
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: stack-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
  queue: max
jobs:
  backend:
    name: ⚙️ Backend
    uses: $/.github/workflows/reusable-backend.yml
    with:
      branch: ${{ github.ref_name }}
      target: ${{ inputs.target }}
      build: ${{ inputs.build }}
    secrets: inherit
