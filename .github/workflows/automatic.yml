name: Automatic stack CI/CD
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: stack-${{ github.event_name == 'push' && 'production' || github.head_ref }}
  cancel-in-progress: false
  queue: max
jobs:
  database:
    uses: ./.github/workflows/reusable-database.yml
    secrets: inherit
  backend:
    needs: database
    uses: ./.github/workflows/reusable-backend.yml
    secrets: inherit
  frontend:
    needs: backend
    uses: ./.github/workflows/reusable-frontend.yml
    secrets: inherit
