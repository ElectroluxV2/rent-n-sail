name: Reusable frontend CI/CD
on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: ""
      target:
        type: string
        default: ""
      build:
        type: boolean
        default: false
    secrets:
      VERCEL_TOKEN:
        required: false
    outputs:
      url:
        value: ${{ jobs.frontend.outputs.url }}
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  frontend:
    name: Deployment
    runs-on: ubuntu-26.04
    concurrency:
      group: &environment frontend-${{ (inputs.target || (github.event_name == 'push' && 'production' || 'preview')) == 'production' && 'production' || (inputs.branch || github.head_ref || github.ref_name) }}
      cancel-in-progress: false
      queue: max
    environment:
      name: *environment
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      COMPONENT: frontend
      DEPLOY_BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
      DEPLOY_TARGET: ${{ inputs.target || (github.event_name == 'push' && 'production' || 'preview') }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_FRONTEND_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_BACKEND_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_LOCAL_CONFIG: frontend/vercel.json
    steps:
      - name: 🔍 Check frontend changes
        id: changes
        if: github.event_name == 'push' || github.event.action == 'synchronize'
        uses: $/.github/actions/component-changes
        with:
          path: frontend/
      - name: 🧭 Select build path
        id: selection
        uses: actions/github-script@v9.0.0
        env:
          BUILD: ${{ inputs.build || steps.changes.outputs.changed == 'true' || github.event.action == 'opened' || github.event.action == 'reopened' }}
        with:
          # language=javascript
          script: |
            const build = process.env.BUILD === 'true';
            core.info(build ? 'Build path: run validation and build the frontend.' : 'Build path: reuse the preview, or restore production output if absent.');
            core.setOutput('build', build);
            core.exportVariable('BUILD_REQUESTED', String(build));
      - name: 📥 Checkout source
        id: source
        if: steps.selection.outputs.build == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up Node.js and pnpm
        uses: pnpm/setup@v3.1.1
        if: steps.selection.outputs.build == 'true'
        with:
          working-directory: frontend
          cache: true
      - name: 🧹 Lint
        id: lint
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        working-directory: frontend
        # language=bash
        run: pnpm exec eslint . --format gha
      - name: 🎨 Check formatting
        id: format
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        uses: oxc-project/oxfmt-action@v0.0.1
        with:
          working-directory: frontend
      - name: 🧪 Run tests
        id: tests
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        working-directory: frontend
        # language=bash
        run: pnpm exec ng test --watch=false --reporters=default --reporters=github-actions
      - name: 🔨 Build application
        id: build
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        working-directory: frontend
        # language=bash
        run: pnpm exec ng build
      - name: ❌ Report validation failure
        if: contains(steps.*.outcome, 'failure')
        uses: actions/github-script@v9.0.0
        with:
          # language=javascript
          script: core.setFailed('Frontend validation failed.');
      - name: 🚀 Ensure deployment
        id: deploy
        uses: $/.github/actions/vercel-prebuilt-deploy
        env:
          RNS_SOURCE_READY: ${{ steps.source.outcome == 'success' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
