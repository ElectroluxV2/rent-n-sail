name: Reusable frontend CI/CD
on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: ""
      target:
        type: string
        default: ""
      build:
        type: boolean
        default: false
    secrets:
      VERCEL_TOKEN:
        required: false
    outputs:
      url:
        value: ${{ jobs.frontend.outputs.url }}
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  frontend:
    name: Deployment
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    concurrency:
      group: frontend-${{ (inputs.target || (github.event_name == 'push' && 'production' || 'preview')) == 'production' && 'production' || (inputs.branch || github.head_ref || github.ref_name) }}
      cancel-in-progress: false
      queue: max
    environment:
      name: frontend-${{ (inputs.target || (github.event_name == 'push' && 'production' || 'preview')) == 'production' && 'production' || (inputs.branch || github.head_ref || github.ref_name) }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      COMPONENT: frontend
      DEPLOY_BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
      DEPLOY_TARGET: ${{ inputs.target || (github.event_name == 'push' && 'production' || 'preview') }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_FRONTEND_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_BACKEND_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_LOCAL_CONFIG: frontend/vercel.json
    steps:
      - name: 🔍 Check frontend changes
        id: changes
        if: github.event_name == 'push' || github.event.action == 'synchronize'
        uses: $/.github/actions/component-changes
        with:
          path: frontend/
      - name: 🧭 Select build path
        id: selection
        env:
          BUILD: ${{ inputs.build || steps.changes.outputs.changed == 'true' || github.event.action == 'opened' || github.event.action == 'reopened' }}
        # language=bash
        run: |
          if [[ "$BUILD" == true ]]; then
            echo "Build path: run validation and build the frontend."
          else
            echo "Build path: reuse the preview, or restore production output if absent."
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "BUILD_REQUESTED=$BUILD" >> "$GITHUB_ENV"
      - name: 📥 Checkout source
        id: source
        if: steps.selection.outputs.build == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up Node.js and pnpm
        uses: pnpm/setup@v3.1.1
        if: steps.selection.outputs.build == 'true'
        with:
          working-directory: frontend
          cache: true
      - name: 🧹 Lint
        id: lint
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        working-directory: frontend
        # language=bash
        run: pnpm exec eslint . --format gha
      - name: 🎨 Check formatting
        id: format
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        uses: oxc-project/oxfmt-action@v0.0.1
        with:
          working-directory: frontend
      - name: 🧪 Run tests
        id: tests
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        working-directory: frontend
        # language=bash
        run: pnpm exec ng test --watch=false --reporters=default --reporters=github-actions
      - name: 🔨 Build application
        id: build
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        working-directory: frontend
        # language=bash
        run: pnpm exec ng build
      - name: ❌ Report validation failure
        if: contains(steps.*.outcome, 'failure')
        # language=bash
        run: |
          echo "::error::Frontend validation failed."
          exit 1
      - name: 🚀 Ensure deployment
        id: deploy
        uses: $/.github/actions/vercel-prebuilt-deploy
        env:
          RNS_SOURCE_READY: ${{ steps.source.outcome == 'success' }}
          RNS_FRONTEND_BUILD_READY: ${{ steps.selection.outputs.build }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
