name: Reusable frontend CI/CD
on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: ""
      target:
        type: string
        default: ""
      build:
        type: boolean
        default: false
    secrets:
      VERCEL_TOKEN:
        required: false
    outputs:
      url:
        value: ${{ jobs.frontend.outputs.url }}
permissions:
  contents: read
  pull-requests: write
jobs:
  frontend:
    name: Deployment
    runs-on: ubuntu-26.04
    environment:
      name: frontend-${{ case(inputs.target == 'production' || (inputs.target == '' && github.event_name == 'push'), 'production', inputs.branch || github.head_ref || github.ref_name) }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      COMPONENT: frontend
      DEPLOY_BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
      DEPLOY_TARGET: ${{ case(inputs.target != '', inputs.target, github.event_name == 'push', 'production', 'preview') }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_FRONTEND_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_BACKEND_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_LOCAL_CONFIG: frontend/vercel.json
    steps:
      - name: 🔍 Check frontend changes
        id: changes
        uses: $/.github/actions/component-changes
        with:
          path: frontend/
      - name: 🧭 Select build path
        uses: actions/github-script@v9.0.0
        env:
          BUILD: ${{ inputs.build || steps.changes.outputs.changed == 'true' }}
        with:
          # language=javascript
          script: |
            const build = process.env.BUILD === 'true';
            core.info(build ? 'Build path: validate and deploy the frontend.' : 'No frontend changes: leave the existing deployment untouched.');
            core.exportVariable('BUILD_REQUESTED', String(build));
      - name: 📥 Checkout source
        if: env.BUILD_REQUESTED == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up Node.js and pnpm
        uses: pnpm/setup@v3.1.1
        if: env.BUILD_REQUESTED == 'true'
        with:
          working-directory: frontend
          cache: true
      - name: 🧹 Lint
        if: ${{ !cancelled() && env.BUILD_REQUESTED == 'true' }}
        working-directory: frontend
        # language=bash
        run: pnpm exec eslint . --format gha
      - name: 🎨 Check formatting
        if: ${{ !cancelled() && env.BUILD_REQUESTED == 'true' }}
        uses: oxc-project/oxfmt-action@v0.0.1
        with:
          working-directory: frontend
      - name: 🧪 Run tests
        if: ${{ !cancelled() && env.BUILD_REQUESTED == 'true' }}
        working-directory: frontend
        # language=bash
        run: pnpm exec ng test --watch=false --reporters=default --reporters=github-actions
      - name: 🔨 Build application
        if: ${{ !cancelled() && env.BUILD_REQUESTED == 'true' }}
        working-directory: frontend
        # language=bash
        run: pnpm exec ng build
      - name: 🚀 Ensure deployment
        id: deploy
        uses: $/.github/actions/vercel-prebuilt-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
