name: Reusable backend CI/CD
on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: ""
      target:
        type: string
        default: ""
      build:
        type: boolean
        default: false
    secrets:
      VERCEL_TOKEN:
        required: false
      NEON_API_KEY:
        required: false
      NEON_PROJECT_ID:
        required: false
    outputs:
      url:
        value: ${{ jobs.backend.outputs.url }}
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  backend:
    name: Ensure deployment
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: backend-${{ (inputs.target || (github.event_name == 'push' && 'production' || 'preview')) == 'production' && 'production' || (inputs.branch || github.head_ref || github.ref_name) }}
      cancel-in-progress: false
      queue: max
    environment:
      name: backend-${{ (inputs.target || (github.event_name == 'push' && 'production' || 'preview')) == 'production' && 'production' || (inputs.branch || github.head_ref || github.ref_name) }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      COMPONENT: backend
      DEPLOY_BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
      DEPLOY_TARGET: ${{ inputs.target || (github.event_name == 'push' && 'production' || 'preview') }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME || 'neondb' }}
      NEON_ROLE_NAME: ${{ vars.NEON_ROLE_NAME || 'neondb_owner' }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_BACKEND_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
      VERCEL_FRONTEND_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
      VERCEL_LOCAL_CONFIG: vercel.json
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check backend changes
        id: changes
        if: github.event_name == 'push' || github.event.action == 'synchronize'
        uses: $/.github/actions/component-changes
        with:
          path: backend/
      - name: Select build path
        id: selection
        env:
          BUILD: ${{ inputs.build || steps.changes.outputs.changed == 'true' || github.event.action == 'opened' || github.event.action == 'reopened' }}
        # language=bash
        run: |
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "BUILD_REQUESTED=$BUILD" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.2
        if: steps.selection.outputs.build == 'true'
        with:
          working-directory: backend
          enable-cache: true
          cache-python: true
          activate-environment: true
      - name: Install backend dependencies
        if: steps.selection.outputs.build == 'true'
        # language=bash
        run: uv sync --directory backend --locked
      - name: Lint
        id: lint
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        # language=bash
        run: uv run --directory backend --locked ruff check --output-format=github
      - name: Format
        id: format
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        # language=bash
        run: uv run --directory backend --locked ruff format --check --output-format=github
      - name: Tests with GitHub annotations
        id: tests
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        env:
          PYTEST_RUN_PATH: backend
        # language=bash
        run: uv run --directory backend --locked pytest -q
      - name: Fail after all selected checks
        if: contains(steps.*.outcome, 'failure')
        # language=bash
        run: |
          echo "::error::Backend validation failed."
          exit 1
      - name: Ensure backend deployment
        id: deploy
        uses: $/.github/actions/vercel-prebuilt-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
