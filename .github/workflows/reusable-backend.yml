name: Reusable backend CI/CD
on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: ""
      target:
        type: string
        default: ""
      build:
        type: boolean
        default: false
    secrets:
      VERCEL_TOKEN:
        required: false
      NEON_API_KEY:
        required: false
      NEON_PROJECT_ID:
        required: false
    outputs:
      url:
        value: ${{ jobs.backend.outputs.url }}
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  backend:
    name: Deployment
    runs-on: ubuntu-26.04
    concurrency:
      group: &environment backend-${{ (inputs.target || (github.event_name == 'push' && 'production' || 'preview')) == 'production' && 'production' || (inputs.branch || github.head_ref || github.ref_name) }}
      cancel-in-progress: false
      queue: max
    environment:
      name: *environment
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      COMPONENT: backend
      DEPLOY_BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
      DEPLOY_TARGET: ${{ inputs.target || (github.event_name == 'push' && 'production' || 'preview') }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME || 'neondb' }}
      NEON_ROLE_NAME: ${{ vars.NEON_ROLE_NAME || 'neondb_owner' }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_BACKEND_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
      VERCEL_FRONTEND_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
      VERCEL_LOCAL_CONFIG: vercel.json
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: 🔍 Check backend changes
        id: changes
        if: github.event_name == 'push' || github.event.action == 'synchronize'
        uses: $/.github/actions/component-changes
        with:
          path: backend/
      - name: 🧭 Select build path
        id: selection
        uses: actions/github-script@v9.0.0
        env:
          BUILD: ${{ inputs.build || steps.changes.outputs.changed == 'true' || github.event.action == 'opened' || github.event.action == 'reopened' }}
        with:
          # language=javascript
          script: |
            const build = process.env.BUILD === 'true';
            core.info(build ? 'Build path: run validation and build the backend.' : 'Build path: reuse the preview, or restore production output if absent.');
            core.setOutput('build', build);
            core.exportVariable('BUILD_REQUESTED', String(build));
      - name: 📥 Checkout source
        id: source
        if: steps.selection.outputs.build == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        if: steps.selection.outputs.build == 'true'
        with:
          working-directory: backend
          enable-cache: true
          cache-python: true
          activate-environment: true
      - name: 📦 Install backend dependencies
        if: steps.selection.outputs.build == 'true'
        # language=bash
        run: uv sync --directory backend --locked
      - name: 🧹 Lint
        id: lint
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        # language=bash
        run: uv run --directory backend --locked ruff check --output-format=github
      - name: 🎨 Check formatting
        id: format
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        # language=bash
        run: uv run --directory backend --locked ruff format --check --output-format=github
      - name: 🧪 Run tests
        id: tests
        if: steps.selection.outputs.build == 'true'
        continue-on-error: true
        env:
          PYTEST_RUN_PATH: backend
        # language=bash
        run: uv run --directory backend --locked pytest -q
      - name: ❌ Report validation failure
        if: contains(steps.*.outcome, 'failure')
        uses: actions/github-script@v9.0.0
        with:
          # language=javascript
          script: core.setFailed('Backend validation failed.');
      - name: 🚀 Ensure deployment
        id: deploy
        uses: $/.github/actions/vercel-prebuilt-deploy
        env:
          RNS_SOURCE_READY: ${{ steps.source.outcome == 'success' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
