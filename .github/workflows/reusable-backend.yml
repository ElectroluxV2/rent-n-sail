name: Reusable backend CI/CD
on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: ""
      target:
        type: string
        default: ""
      build:
        type: boolean
        default: false
    secrets:
      VERCEL_TOKEN:
        required: false
      NEON_API_KEY:
        required: false
      NEON_PROJECT_ID:
        required: false
    outputs:
      url:
        value: ${{ jobs.backend.outputs.url }}
permissions:
  contents: read
  pull-requests: write
jobs:
  backend:
    name: Deployment
    runs-on: ubuntu-26.04
    environment:
      name: backend-${{ case(inputs.target == 'production' || (inputs.target == '' && github.event_name == 'push'), 'production', inputs.branch || github.head_ref || github.ref_name) }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      COMPONENT: backend
      DEPLOY_BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
      DEPLOY_TARGET: ${{ case(inputs.target != '', inputs.target, github.event_name == 'push', 'production', 'preview') }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
      NEON_PARENT_BRANCH_ID: ${{ vars.NEON_PARENT_BRANCH_ID }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_BACKEND_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
      VERCEL_FRONTEND_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
    steps:
      - name: 🔍 Check backend changes
        id: changes
        uses: $/.github/actions/component-changes
        with:
          path: backend/
      - name: 🧭 Select build path
        uses: actions/github-script@v9.0.0
        env:
          BUILD: ${{ inputs.build || steps.changes.outputs.changed == 'true' }}
        with:
          # language=javascript
          script: |
            const build = process.env.BUILD === 'true';
            core.info(build ? 'Build path: validate and deploy the backend.' : 'No backend changes: leave the existing deployment untouched.');
            core.exportVariable('BUILD_REQUESTED', String(build));
      - name: 📥 Checkout source
        if: env.BUILD_REQUESTED == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        if: env.BUILD_REQUESTED == 'true'
        env:
          # The project venv gets a managed Python 3.14; later uv commands reuse that venv.
          UV_PYTHON_PREFERENCE: only-managed
        with:
          working-directory: backend
          enable-cache: true
          cache-python: true
          activate-environment: true
      - name: 📦 Install backend dependencies
        if: env.BUILD_REQUESTED == 'true'
        # language=bash
        run: uv sync --directory backend --locked
      - name: 🧹 Lint
        if: ${{ !cancelled() && env.BUILD_REQUESTED == 'true' }}
        # language=bash
        run: uv run --directory backend --locked ruff check --output-format=github
      - name: 🎨 Check formatting
        if: ${{ !cancelled() && env.BUILD_REQUESTED == 'true' }}
        # language=bash
        run: uv run --directory backend --locked ruff format --check --output-format=github
      - name: 🧪 Run tests
        if: ${{ !cancelled() && env.BUILD_REQUESTED == 'true' }}
        env:
          PYTEST_RUN_PATH: backend
        # language=bash
        run: uv run --directory backend --locked pytest -q
      - name: 🚀 Ensure deployment
        id: deploy
        uses: $/.github/actions/vercel-prebuilt-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
