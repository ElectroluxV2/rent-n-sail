name: ON_PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'ElectroluxV2/rent-n-sail'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - name: Pnpm
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Angular
        run: pnpm exec ng build
